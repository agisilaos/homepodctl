name: verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fish
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install fish

      - name: Run verification
        run: make verify
