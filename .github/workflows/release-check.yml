name: release-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  release-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fish
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install fish

      - name: Run release check
        run: |
          release_version="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$/\1/p' CHANGELOG.md | head -n 1)"
          if [[ -z "$release_version" ]]; then
            echo "Could not determine release version from CHANGELOG.md" >&2
            exit 1
          fi
          make release-check VERSION="$release_version"
